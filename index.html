<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12261f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Familien-Adventskalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Richtung: ein Papp-Adventskalender auf Tannengrün.
   Ruhige grüne Fläche, ein cremefarbener Kalenderbogen als Herzstück,
   perforierte Türchen, Wachssiegel-Rot für heute und erledigt. */
:root{
  --pine:#12261f; --pine2:#1a332a; --pine3:#24443a;
  --cream:#f3ead8; --muted:#a3b2a9; --faint:#73867b; --hair:rgba(243,234,216,.10);
  --paper:#f1e7d3; --door:#e8dabf; --kraft:#cdb185; --ink:#1f2b25; --ink2:#56635b; --ink3:#8b9188;
  --perf:rgba(31,43,37,.30); --red:#a8362b; --red2:#8f2c23; --gold:#d6b26a; --wa:#1f6b45;
  --serif:"Fraunces",Georgia,serif; --sans:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--pine);color:var(--cream);font:16px/1.5 var(--sans)}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(32px + env(safe-area-inset-bottom));overflow-x:clip}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:24px 16px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 4px 24px}
.over{font-size:13px;color:var(--muted);margin:0 0 4px}
h1{font-family:var(--serif);font-weight:500;font-size:36px;line-height:1.05;margin:0;letter-spacing:-.01em}
.who{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--hair);background:transparent;color:var(--muted);font-size:14px;cursor:pointer;transition:background-color .15s var(--ease)}
.who:active{background:var(--pine2)}

.vbar{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;margin:0 0 16px;border-radius:12px;background:var(--pine2)}
.vbar button{height:36px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;cursor:pointer}
.vbar button.on{background:var(--pine3);color:var(--cream)}

/* Countdown */
.panel{background:var(--pine2);border:1px solid var(--hair);border-radius:16px;padding:20px}
.panel+.panel,.panel+.sheetcal{margin-top:16px}
.lbl{font-size:13px;color:var(--muted);margin:0 0 12px}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.cd div{text-align:center;border-left:1px solid var(--hair)}
.cd div:first-child{border-left:0}
.cd b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(32px,10vw,44px);line-height:1.1;font-variant-numeric:tabular-nums}
.cd span{font-size:12px;color:var(--muted)}
.xmas .cd b{font-size:clamp(26px,8vw,32px)}
.heute{font-family:var(--serif);font-size:26px;margin:0}

.joke{margin:20px 0 0;padding-top:20px;border-top:1px solid var(--hair)}
.joke p{margin:0;font-size:17px;line-height:1.45}
.joke p.lbl{font-size:13px;color:var(--muted);margin:0 0 8px}
.joke .pointe{margin-top:8px;color:var(--gold)}

/* Überraschung: ein Zettel mit Wachssiegel */
.surprise{display:flex;align-items:center;gap:16px;width:100%;margin-top:16px;padding:16px;border:0;border-radius:14px;
  background:var(--paper);color:var(--ink);text-align:left;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.22);transition:transform .12s var(--ease)}
.surprise:active{transform:scale(.98)}
.surprise b{display:block;font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.2}
.surprise span{font-size:14px;color:var(--ink2)}
.surprise.done{background:var(--door);box-shadow:none}
.seal{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--paper);
  background:radial-gradient(circle at 35% 30%,#bf4436,var(--red) 55%,var(--red2));box-shadow:inset 0 0 0 3px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.2)}
.surprise.done .seal{background:var(--ink3)}
.seal svg{width:22px;height:22px}
.shuffle{display:block;width:100%;margin-top:12px;height:40px;border:0;background:transparent;color:var(--faint);font-size:14px;cursor:pointer}

/* Kalenderbogen */
.sheetcal{background:var(--paper);border-radius:16px;padding:12px;box-shadow:0 16px 40px rgba(0,0,0,.28)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;grid-auto-flow:dense;gap:8px}
.door{position:relative;min-height:84px;border-radius:8px;border:1.5px dashed var(--perf);background:var(--door);color:var(--ink);
  display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;transition:transform .12s var(--ease),background-color .15s var(--ease)}
.door:active{transform:scale(.96)}
.door .nr{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.door .typ{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:var(--ink2)}
.door.big{grid-column:span 2;grid-row:span 2}
.door.big .nr{font-size:56px}
.door.wide{grid-column:span 2}
.door.locked{cursor:default;color:var(--ink3);border-color:rgba(31,43,37,.16)}
.door.locked .typ{display:none}
.door.today{background:var(--red);color:var(--paper);border-color:rgba(241,231,211,.55);box-shadow:0 4px 12px rgba(143,44,35,.35)}
.door.today .typ{color:rgba(241,231,211,.8)}
.door.done{background:var(--kraft);border-style:solid;border-color:rgba(31,43,37,.12);box-shadow:inset 0 3px 8px rgba(60,40,10,.25)}
.door.done .nr{position:absolute;top:8px;left:10px;font-size:15px;color:rgba(31,43,37,.6)}
.door.done .typ{display:none}
.door.done::after{content:"";width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#bf4436,var(--red) 55%,var(--red2));box-shadow:0 1px 2px rgba(0,0,0,.25)}

/* Rangliste */
.board{margin-top:32px;padding:0 4px}
.board h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0 0 8px}
.row{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center;min-height:44px;border-top:1px solid var(--hair);font-size:16px}
.row .pl{color:var(--faint);font-variant-numeric:tabular-nums}
.row .pk{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.row.me .nm{color:var(--gold)}
.mode{margin-top:24px;text-align:center;font-size:12px;color:var(--faint)}

/* Blatt von unten */
.overlay{position:fixed;inset:0;z-index:10;display:none;align-items:flex-end;justify-content:center;background:rgba(6,14,11,.6)}
.overlay.show{display:flex}
.sheet{width:100%;max-width:520px;max-height:90vh;overflow:auto;background:var(--paper);color:var(--ink);
  border-radius:20px 20px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom));animation:up .22s var(--ease)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.kicker{font-size:13px;color:var(--ink2);margin:0}
.sheet h3{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.15;margin:4px 0 12px}
.sheet p{font-size:17px;line-height:1.5;margin:0 0 16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:12px;border:0;
  font-size:16px;font-weight:500;text-decoration:none;cursor:pointer;margin-top:8px;transition:background-color .15s var(--ease),transform .12s var(--ease)}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.wa{background:var(--wa);color:#fff}
.btn.sec{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(31,43,37,.22)}
.btn.sec.on{background:var(--ink);color:var(--paper);box-shadow:none}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn.link{background:transparent;color:var(--ink2);height:44px;margin-top:4px}
.opts{display:grid;gap:8px;margin:0 0 8px}
.opt{min-height:52px;padding:12px 16px;border-radius:12px;border:1px solid rgba(31,43,37,.16);background:#fbf6ec;color:var(--ink);font-size:16px;text-align:left;cursor:pointer}
.opt.right{border-color:#2f7a4f;background:#e2efe3}
.opt.wrong{border-color:var(--red);background:#f5e1dc}
.opt:disabled{cursor:default}
.res{font-size:16px;line-height:1.5;margin:8px 0 0}
.res b{font-weight:600}
.res.sm{font-size:14px;color:var(--ink2);margin:4px 0 8px}
.dabei{font-size:14px;color:var(--ink2);margin:12px 0 0}
.namebox input{width:100%;height:52px;font:inherit;font-size:18px;padding:0 16px;border-radius:12px;border:1px solid rgba(31,43,37,.22);background:#fbf6ec;color:var(--ink);margin:0 0 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<main>
  <header>
    <div><p class="over">Familie · Advent 2026</p><h1 id="titel">24 Türchen</h1></div>
    <button class="who" id="whoBtn"></button>
  </header>
  <div class="vbar" id="vbar" hidden></div>
  <section class="panel" id="pre" hidden></section>
  <section class="panel xmas" id="xmas" hidden><p class="lbl">Bis Heiligabend</p><div class="cd" id="cdX"></div></section>
  <div class="sheetcal" id="cal"><div class="grid" id="grid"></div></div>
  <section class="board" id="boardBox" hidden>
    <h2>Rangliste</h2>
    <div id="board"></div>
  </section>
  <div class="mode" id="mode"></div>
</main>

<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
{
/* =========================================================
   EINSTELLUNGEN
   1) Firebase: Projekt anlegen → Realtime Database aktivieren →
      Web-App registrieren → Config hier einfügen.
      Ohne Config läuft alles lokal (nur auf dem eigenen Handy).
   2) Vorschau: index.html?vorschau=1 zum Testen.
   ========================================================= */
const FIREBASE_CONFIG = null;
/* Beispiel:
const FIREBASE_CONFIG = {
  apiKey: "...",
  authDomain: "dein-projekt.firebaseapp.com",
  databaseURL: "https://dein-projekt-default-rtdb.europe-west1.firebasedatabase.app",

  appId: "..."
};
*/
const DB_PATH = "advent2026";

/* ======================= INHALTE =======================
   typ: frage | quiz | foto | aufgabe
   quiz: optionen + richtig (Index ab 0) + info (Auflösung)
   ======================================================= */
const TAGE = [
  {typ:"frage", titel:"Ganz früher", text:"Was ist deine früheste Weihnachtserinnerung? Egal wie klein – schreib sie in die Gruppe."},
  {typ:"quiz", titel:"Woher kommt der Adventskranz?", text:"Der erste Adventskranz hing 1839 in einem Waisenhaus. In welchem Land?",
    optionen:["Schweden","Deutschland","Österreich","Dänemark"], richtig:1,
    info:"Johann Hinrich Wichern hat ihn in Hamburg erfunden – damals mit 24 Kerzen, damit die Kinder die Tage zählen konnten."},
  {typ:"foto", titel:"Deko-Liebling", text:"Schick ein Foto von deinem Lieblings-Deko-Teil. Bonus, wenn es eine Geschichte hat."},
  {typ:"foto", titel:"Familie an der Wand", text:"Welches Familienfoto hängt oder steht bei dir zu Hause? Fotografier es und schick es in die Gruppe."},
  {typ:"quiz", titel:"Schätzfrage", text:"Wie alt ist ein Weihnachtsbaum ungefähr, wenn er verkauft wird?",
    optionen:["ca. 2 Jahre","ca. 5 Jahre","ca. 10 Jahre","ca. 20 Jahre"], richtig:2, info:"Rund 8 bis 12 Jahre steht so ein Baum auf dem Feld, bis er bei uns im Wohnzimmer landet."},
  {typ:"foto", titel:"Nikolaus-Schuh", text:"Heute ist Nikolaus. Zeig den Schuh, den du rausgestellt hast – oder rausgestellt hättest."},
  {typ:"frage", titel:"Familien-Schätzfrage", text:"Wie alt sind alle in dieser Gruppe zusammen? Nicht rechnen, nur schätzen – und dann eure Zahl in die Gruppe. Wer am nächsten dran ist, gewinnt."},
  {typ:"foto", titel:"Sockencheck", text:"Zeig deine Socken. Jetzt. Keine Ausreden."},
  {typ:"quiz", titel:"Allein zu Haus", text:"In welchem Jahr kam „Kevin – Allein zu Haus“ ins Kino?",
    optionen:["1987","1990","1993","1996"], richtig:1, info:"1990 – und läuft seitdem jedes Jahr wieder."},
  {typ:"quiz", titel:"Emoji-Lied", text:"Welches Weihnachtslied ist das? 🔔🔔🔔 🦌🛷💨",
    optionen:["Stille Nacht","O Tannenbaum","Jingle Bells","Last Christmas"], richtig:2, info:"Jingle Bells – ursprünglich übrigens ein Lied über ein Schlittenrennen, nicht über Weihnachten."},
  {typ:"foto", titel:"Sperrbildschirm", text:"Mach einen Screenshot von deinem Sperrbildschirm und schick ihn in die Gruppe."},
  {typ:"quiz", titel:"Schätzfrage", text:"Wie viele Tage dauert die Adventszeit in diesem Jahr – vom 1. Advent bis Heiligabend?",
    optionen:["22 Tage","24 Tage","26 Tage","28 Tage"], richtig:2, info:"26 Tage: Der 1. Advent war am 29. November. Der Kalender hat trotzdem nur 24 Türchen."},
  {typ:"foto", titel:"Lichtertag", text:"Heute ist Luciafest, das Fest der Lichter. Schick ein Foto von einer Kerze oder Lichterkette bei dir."},
  {typ:"foto", titel:"Zeitreise", text:"Such ein altes Weihnachtsfoto raus (gern peinlich) und schick es in die Gruppe. Die anderen raten, wann es war."},
  {typ:"foto", titel:"Mützen-Selfie", text:"Selfie mit Weihnachtsmütze. Keine da? Dann eben irgendwas anderes auf dem Kopf."},
  {typ:"quiz", titel:"Schätzfrage", text:"Wie viele Weihnachtsbäume werden in Deutschland pro Jahr ungefähr verkauft?",
    optionen:["ca. 5 Millionen","ca. 10 Millionen","ca. 25 Millionen","ca. 50 Millionen"], richtig:2, info:"Rund 23 bis 25 Millionen – die meisten davon Nordmanntannen."},
  {typ:"quiz", titel:"Schätzfrage", text:"Wie viele Kalorien hat ungefähr eine Tasse Glühwein (0,2 l)?",
    optionen:["ca. 50 kcal","ca. 100 kcal","ca. 200 kcal","ca. 400 kcal"], richtig:2, info:"Rund 200 kcal – vor allem durch Zucker und Alkohol."},
  {typ:"foto", titel:"Familienschatz", text:"Zeig etwas bei dir, das aus der Familie stammt – von Oma, Opa, Eltern oder Geschwistern. Ein Satz dazu, woher es kommt, reicht."},
  {typ:"quiz", titel:"Wortherkunft", text:"Was bedeutet das lateinische Wort „Advent“?",
    optionen:["Warten","Ankunft","Licht","Feier"], richtig:1, info:"Adventus = Ankunft."},
  {typ:"foto", titel:"Fensterblick", text:"Mach ein Foto aus deinem Fenster – so wie es gerade ist."},
  {typ:"quiz", titel:"Sonnenwende", text:"Was ist rund um den 21. Dezember besonders?",
    optionen:["Längste Nacht des Jahres","Erster Schnee ist statistisch fällig","Vollmond","Tag mit den meisten Paketen"], richtig:0, info:"Wintersonnenwende – ab jetzt werden die Tage wieder länger."},
  {typ:"frage", titel:"Tradition", text:"Welche Familientradition sollen wir unbedingt behalten – oder welche sollten wir neu einführen?"},
  {typ:"aufgabe", titel:"Summ mal", text:"Schick eine Sprachnachricht: 10 Sekunden ein Weihnachtslied summen (nicht singen). Die anderen raten."},
  {typ:"foto", titel:"Heiligabend", text:"Schick ein Foto von eurem Baum oder Tisch – und einen Wunsch für nächstes Jahr. Frohe Weihnachten."},
];

/* Aufwärmrunde: vor dem 1.12. schon offen */
const BONUS = [ // Überraschungs-Topf: jeder bekommt pro Tag (24.–30.11.) eine zufällige davon
  {typ:"foto", titel:"Erste Deko", text:"Zeig deine erste Weihnachtsdeko – oder das Chaos davor. Beides zählt."},
  {typ:"foto", titel:"Kuschelecke", text:"Wo sitzt du an Winterabenden am liebsten? Foto von deinem Lieblingsplatz zu Hause."},
  {typ:"foto", titel:"Lieblingstasse", text:"Zeig die Tasse, aus der du am liebsten trinkst – gern mit Inhalt."},
  {typ:"foto", titel:"Was gibt's heute?", text:"Foto von deinem Essen heute – egal ob Festmahl oder Butterbrot."},
  {typ:"foto", titel:"Hausschuh-Check", text:"Zeig deine Hausschuhe. Oder deine Füße, falls du keine hast."},
  {typ:"foto", titel:"Sofablick", text:"Setz dich aufs Sofa und fotografier, was du von da aus siehst."},
  {typ:"foto", titel:"Haustier oder Kuscheltier", text:"Zeig dein Haustier – oder, falls keins da ist, das nächstbeste Kuscheltier."},
  {typ:"frage", titel:"Wunsch", text:"Was wünschst du dir dieses Jahr – nicht zum Auspacken, sondern zum Erleben?"},
  {typ:"frage", titel:"Ohrwurm", text:"Welches Weihnachtslied geht dir jedes Jahr nicht mehr aus dem Kopf?"},
  {typ:"frage", titel:"Vorfreude", text:"Worauf freust du dich im Dezember am meisten?"},
  {typ:"frage", titel:"Familienessen", text:"Welches Essen aus der Familie könntest du jeden Tag essen?"},
  {typ:"frage", titel:"Die Geschichte", text:"Welche Familiengeschichte wird bei jedem Treffen wieder erzählt?"},
  {typ:"frage", titel:"Kinderzimmer", text:"Was war früher dein absolutes Lieblingsspielzeug?"},
  {typ:"aufgabe", titel:"Ein Emoji", text:"Schick genau ein Emoji in die Gruppe, das deine Woche beschreibt. Ohne Erklärung."},
  {typ:"aufgabe", titel:"Drei Wörter", text:"Beschreib deinen heutigen Tag in genau drei Wörtern."},
  {typ:"aufgabe", titel:"Ho ho ho", text:"Schick eine Sprachnachricht mit deinem besten „Ho ho ho“."},
  {typ:"aufgabe", titel:"Gesichtsausdruck", text:"Selfie mit deinem müdesten oder deinem fröhlichsten Gesicht – du entscheidest."},
  {typ:"aufgabe", titel:"Novembernote", text:"Welche Note gibst du dem November? 1 bis 10, ab in die Gruppe."},
  {typ:"satz", titel:"Heute nichts", text:"Heute musst du gar nichts machen. Einfach nur: schön, dass du dabei bist."},
  {typ:"satz", titel:"Kleiner Tipp", text:"Heute Abend eine Kerze an und das Handy für zehn Minuten weglegen. Danach darfst du wieder reinschauen."},
  {typ:"satz", titel:"Wusstest du?", text:"In Norwegen versteckt man an Heiligabend traditionell die Besen – damit die Hexen sie nicht klauen."},
  {typ:"satz", titel:"Respekt", text:"Noch nicht mal Dezember, und du schaust schon rein. Du bist bereit."},
];
/* Witz oder Spruch für jeden Tag bis zum 1.12. (Tag im November → Text) */
const SPRUECHE = {
  24:["Warum sind Weihnachtsbäume so schlecht im Stricken?","Sie lassen ständig die Nadeln fallen."],
  25:["Was sagt ein Schneemann zum anderen?","„Riechst du auch Möhren?“"],
  26:["Wie heißt die Frau vom Weihnachtsmann?","Mary Christmas."],
  27:["Wie nennt man einen Weihnachtsmann, der Angst vor engen Kaminen hat?","Klaustrophobi-Klaus."],
  28:["Vorfreude ist die schönste Freude.",""],
  29:["Heute ist der 1. Advent – erste Kerze an","Erst eine Kerze, dann zwei, dann drei, dann vier …"],
  30:["Welche Türchen bleiben heute noch zu?","Alle 24. Aber nur noch bis Mitternacht."],
};
const SPRUCH_RESERVE = [
  ["Was essen Schneemänner am liebsten?","Eisbein."],
  ["Warum ist der Schneemann so entspannt?","Er weiß: Irgendwann löst sich alles von selbst."],
  ["Warum gehen Engel nie ins Fitnessstudio?","Sie sind schon himmlisch in Form."],
];
const getItem = id => String(id).startsWith("b") ? BONUS[+String(id).slice(1)-1] : TAGE[id-1];
const labelOf = id => String(id).startsWith("b") ? "Überraschung" : `Türchen ${id}`;
const START_MS = Date.UTC(2026,10,30,23,0,0); // 1.12.2026 00:00 in Berlin
const XMAS_MS = Date.UTC(2026,11,23,23,0,0);  // 24.12.2026 00:00 in Berlin
const TYP_LABEL = {frage:"Frage", quiz:"Quiz", foto:"Foto", aufgabe:"Aufgabe", satz:"Gedanke"};
// feste, gemischte Anordnung der Türchen
const REIHENFOLGE = [7,15,2,21,11,24,4,18,13,1,20,9,16,6,23,10,3,19,12,22,8,14,5,17];

/* ======================= DATUM ======================= */
const VORSCHAU = new URLSearchParams(location.search).has("vorschau");
function berlinHeute(){
  const p = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",year:"numeric",month:"numeric",day:"numeric"}).formatToParts(new Date());
  const g = t => +p.find(x=>x.type===t).value;
  return {y:g("year"), m:g("month"), d:g("day")};
}
function offenBis(){
  if (VORSCHAU) return 24;
  const t = berlinHeute();
  if (t.y > 2026 || (t.y===2026 && t.m===12 && t.d>24)) return 24;
  if (t.y===2026 && t.m===12) return t.d;
  return 0;
}
function heuteNr(){ const t=berlinHeute(); return (t.y===2026&&t.m===12&&t.d<=24)?t.d:0; }

/* ======================= ICONS ======================= */
const I = {
  gift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>',
};

/* ======================= SPEICHER ======================= */
let STATE = {};
let fb = null;
const LS_KEY = "advent2026-local";
const modeEl = document.getElementById("mode");

async function initStore(){
  if (FIREBASE_CONFIG){
    try{
      const v = "10.12.2";
      const {initializeApp} = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
      const db = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-database.js`);
      const d = db.getDatabase(initializeApp(FIREBASE_CONFIG));
      fb = {db, d};
      db.onValue(db.ref(d, DB_PATH), snap => { STATE = snap.val() || {}; render(); });
      return;
    }catch(e){ console.error(e); modeEl.textContent = "Keine Verbindung – gerade nur auf diesem Handy"; }
  }
  try{ STATE = JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ STATE = {}; }
  if (!FIREBASE_CONFIG && VORSCHAU) modeEl.textContent = "Vorschau · ohne Firebase, nur auf diesem Handy";
}
function save(path, value){
  if (fb){ fb.db.set(fb.db.ref(fb.d, `${DB_PATH}/${path}`), value); return; }
  const parts = path.split("/"); let o = STATE;
  parts.slice(0,-1).forEach(k => o = (o[k] = o[k] || {}));
  if (value === null) delete o[parts.at(-1)]; else o[parts.at(-1)] = value;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){}
  render();
}
const safeKey = n => n.replace(/[.#$\[\]\/]/g,"_");
const tagData = nr => (STATE.tage && STATE.tage[nr]) || {};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ======================= NAME ======================= */
let NAME = "";
try{ NAME = localStorage.getItem("advent2026-name") || ""; }catch(e){}
function askName(then){
  const s = document.getElementById("sheet");
  s.innerHTML = `
    <h3>Wie heißt du?</h3>
    <div class="namebox"><input id="nameIn" maxlength="20" placeholder="Vorname" value="${esc(NAME)}" autocomplete="given-name" enterkeyhint="done"></div>
    <button class="btn pri" id="nameOk">Weiter</button>`;
  openSheet(!!NAME);
  const inp = document.getElementById("nameIn");
  const go = () => {
    const v = inp.value.trim(); if(!v) return inp.focus();
    NAME = v; try{ localStorage.setItem("advent2026-name", v); }catch(e){}
    closeSheet(); render(); then && then();
  };
  document.getElementById("nameOk").onclick = go;
  inp.onkeydown = e => { if(e.key==="Enter") go(); };
  setTimeout(()=>inp.focus(), 250);
}

/* ======================= ANSICHT ======================= */
let PREVIEW_PHASE = "pre";
const isPre = () => VORSCHAU ? PREVIEW_PHASE==="pre" : Date.now() < START_MS;
const isDone = id => !!(NAME && tagData(id).dabei && tagData(id).dabei[safeKey(NAME)]);

function render(){
  const pre = isPre();
  document.getElementById("whoBtn").textContent = NAME || "Name";
  document.getElementById("titel").textContent = pre ? "Bald geht's los" : "24 Türchen";
  const vbar = document.getElementById("vbar");
  if (VORSCHAU){
    vbar.hidden = false;
    vbar.innerHTML = `<button data-p="pre" class="${pre?"on":""}">Countdown</button><button data-p="kal" class="${pre?"":"on"}">Kalender</button>`;
    vbar.querySelectorAll("button").forEach(b => b.onclick = () => { PREVIEW_PHASE = b.dataset.p; render(); });
  }
  document.getElementById("cal").hidden = pre;
  const xm = document.getElementById("xmas");
  xm.hidden = pre || (!VORSCHAU && heuteNr()===0);
  if (!xm.hidden) tickXmas();
  renderPre();
  if (pre){ document.getElementById("boardBox").hidden = true; return; }

  const offen = offenBis(), heute = heuteNr();
  document.getElementById("grid").innerHTML = REIHENFOLGE.map(nr => {
    const t = TAGE[nr-1], locked = nr > offen, done = !locked && isDone(nr);
    const cls = ["door", nr===24&&"big", nr===1&&"wide", locked&&"locked", nr===heute&&!done&&"today", done&&"done"].filter(Boolean).join(" ");
    const typ = nr===24 ? "Heiligabend" : TYP_LABEL[t.typ];
    return `<button class="${cls}" data-nr="${nr}" ${locked?"disabled":""} aria-label="Türchen ${nr}${locked?", noch zu":done?", erledigt":""}"><span class="nr">${nr}</span><span class="typ">${typ}</span></button>`;
  }).join("");
  document.querySelectorAll("#grid .door:not([disabled])").forEach(b => b.onclick = () => {
    const nr = +b.dataset.nr; NAME ? openDoor(nr) : askName(()=>openDoor(nr));
  });
  renderBoard();
}

function renderBoard(){
  const punkte = {}, dabei = {}, tage = STATE.tage || {};
  Object.entries(tage).forEach(([nr, d]) => {
    const t = getItem(nr);
    if (t && t.typ==="quiz" && d.quiz) Object.entries(d.quiz).forEach(([n, idx]) => { punkte[n] = (punkte[n]||0) + (idx===t.richtig?1:0); });
    Object.keys(d.dabei||{}).forEach(n => dabei[n]=(dabei[n]||0)+1);
  });
  const namen = [...new Set([...Object.keys(punkte), ...Object.keys(dabei)])]
    .sort((a,b)=>(punkte[b]||0)-(punkte[a]||0) || (dabei[b]||0)-(dabei[a]||0) || a.localeCompare(b));
  const box = document.getElementById("boardBox");
  box.hidden = !namen.length;
  const me = NAME ? safeKey(NAME) : "";
  document.getElementById("board").innerHTML = namen.map((n,i)=>{
    const p = punkte[n]||0;
    return `<div class="row${n===me?" me":""}"><span class="pl">${i+1}</span><span class="nm">${esc(n)}</span><span class="pk">${p} ${p===1?"Punkt":"Punkte"} · ${dabei[n]||0}× dabei</span></div>`;
  }).join("");
}

/* Überraschungen: jede Person bekommt pro Tag (24.–30.11.) eine eigene aus dem Topf */
function hashStr(str){ let h=2166136261; for (const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function surpriseFor(name, tag){
  const idx = BONUS.map((_,i)=>i); let seed = hashStr(name.trim().toLowerCase()) || 1;
  for (let i=idx.length-1;i>0;i--){ seed=(Math.imul(seed^(seed>>>15),2246822507)>>>0)||7; const j=seed%(i+1); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx[(tag-24) % idx.length];
}
let PREVIEW_SHIFT = 0;

function renderPre(){
  const box = document.getElementById("pre");
  const old = document.getElementById("surpriseSlot"); if (old) old.remove();
  if (!isPre()){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  const t = berlinHeute();
  const heute = t.m===11 ? t.d : 30;
  const sp = (t.m===11 && SPRUECHE[t.d]) || SPRUCH_RESERVE[t.d % SPRUCH_RESERVE.length];
  let extra = "";
  if (NAME && heute>=24 && heute<=30){
    const i = (surpriseFor(NAME, heute) + PREVIEW_SHIFT) % BONUS.length, id = "b"+(i+1), b = BONUS[i];
    extra = isDone(id)
      ? `<button class="surprise done" data-id="${id}"><span class="seal">${I.check}</span><span><b>Heute erledigt</b><span>Morgen gibt's die nächste</span></span></button>`
      : `<button class="surprise" data-id="${id}"><span class="seal">${I.gift}</span><span><b>Deine Überraschung</b><span>${VORSCHAU?esc(b.titel)+" · "+(i+1)+"/"+BONUS.length:"Für heute"}</span></span></button>`;
    if (VORSCHAU) extra += `<button class="shuffle" id="shuffle">Andere Überraschung zeigen</button>`;
  }
  box.innerHTML = `
    <p class="lbl">Bis zum ersten Türchen</p>
    <div class="cd" id="cd"></div>
    <div class="joke"><p class="lbl">Witz des Tages</p><p>${esc(sp[0])}</p>${sp[1]?`<p class="pointe">${esc(sp[1])}</p>`:""}</div>`;
  if (extra){
    const slot = document.createElement("div"); slot.id = "surpriseSlot"; slot.innerHTML = extra;
    box.after(slot);
    slot.querySelectorAll(".surprise").forEach(b => b.onclick = () => openDoor(b.dataset.id));
    const sh = document.getElementById("shuffle"); if (sh) sh.onclick = () => { PREVIEW_SHIFT++; renderPre(); };
  }
  tickCountdown();
}
function cdHtml(ms){
  const tg=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60;
  const pad = n => String(n).padStart(2,"0");
  return [[tg,tg===1?"Tag":"Tage"],[pad(h),"Std"],[pad(m),"Min"],[pad(s),"Sek"]]
    .map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join("");
}
function tickCountdown(){
  const el = document.getElementById("cd"); if(!el) return;
  const ms = START_MS - Date.now();
  if (ms <= 0 && !VORSCHAU){ render(); return; }
  el.innerHTML = cdHtml(Math.max(ms,0));
}
function tickXmas(){
  const box = document.getElementById("xmas");
  if (!box || box.hidden) return;
  const ms = XMAS_MS - Date.now();
  if (ms <= 0){ box.innerHTML = `<p class="heute">Heute ist Heiligabend</p>`; return; }
  document.getElementById("cdX").innerHTML = cdHtml(ms);
}
setInterval(() => { tickCountdown(); tickXmas(); }, 1000);

/* ======================= TÜRCHEN ======================= */
function openDoor(nr){
  const t = getItem(nr), d = tagData(nr), me = safeKey(NAME);
  const dabeiNamen = Object.keys(d.dabei||{});
  const istDabei = !!(d.dabei && d.dabei[me]);
  const s = document.getElementById("sheet");
  let body = `<p class="kicker">${labelOf(nr)} · ${TYP_LABEL[t.typ]}</p><h3>${esc(t.titel)}</h3><p>${esc(t.text)}</p>`;

  if (t.typ==="quiz"){
    const meine = d.quiz ? d.quiz[me] : undefined, beantwortet = meine !== undefined;
    body += `<div class="opts">` + t.optionen.map((o,i)=>{
      const cls = "opt" + (beantwortet && i===t.richtig ? " right" : beantwortet && i===meine ? " wrong" : "");
      return `<button class="${cls}" data-i="${i}" ${beantwortet?"disabled":""}>${esc(o)}</button>`;
    }).join("") + `</div>`;
    if (beantwortet){
      const alle = Object.values(d.quiz||{}), richtige = alle.filter(x=>x===t.richtig).length;
      body += `<p class="res"><b>${meine===t.richtig?"Richtig · 1 Punkt":"Leider daneben"}</b><br>${esc(t.info)}</p>
        <p class="res sm">${richtige} von ${alle.length} richtig</p>
        <a class="btn wa" id="waBtn" href="#">${I.chat}In der Gruppe teilen</a>`;
    }
  } else if (t.typ==="satz"){
    if (!istDabei) setTimeout(()=>save(`tage/${nr}/dabei/${me}`, true), 0);
  } else {
    body += `<a class="btn wa" id="waBtn" href="#">${I.chat}In WhatsApp antworten</a>
      <button class="btn sec${istDabei?" on":""}" id="doneBtn">${I.check}${istDabei?"Erledigt":"Als erledigt markieren"}</button>`;
  }
  if (t.typ!=="satz" && dabeiNamen.length) body += `<p class="dabei">Dabei: ${dabeiNamen.map(esc).join(", ")}</p>`;
  body += `<button class="btn link" id="closeBtn">Schließen</button>`;
  s.innerHTML = body;
  openSheet(true);

  const reopen = () => setTimeout(()=>openDoor(nr), fb?400:0);
  s.querySelectorAll(".opt:not([disabled])").forEach(b => b.onclick = () => {
    save(`tage/${nr}/quiz/${me}`, +b.dataset.i); save(`tage/${nr}/dabei/${me}`, true); reopen();
  });
  const done = document.getElementById("doneBtn");
  if (done) done.onclick = () => { save(`tage/${nr}/dabei/${me}`, istDabei ? null : true); reopen(); };
  const wa = document.getElementById("waBtn");
  if (wa){
    const msg = t.typ==="quiz"
      ? `${labelOf(nr)}: ${t.titel}\n${(tagData(nr).quiz||{})[me]===t.richtig?"Hab's richtig.":"Lag daneben."} Wer noch?`
      : `${labelOf(nr)} – ${t.titel}\n${t.text}\n\n`;
    wa.href = "https://wa.me/?text=" + encodeURIComponent(msg);
    wa.target = "_blank"; wa.rel = "noopener";
  }
  document.getElementById("closeBtn").onclick = closeSheet;
}

const overlay = document.getElementById("overlay");
function openSheet(closable){ overlay.classList.add("show"); overlay.dataset.closable = closable?"1":""; }
function closeSheet(){ overlay.classList.remove("show"); }
overlay.addEventListener("click", e => { if (e.target===overlay && overlay.dataset.closable) closeSheet(); });
document.getElementById("whoBtn").onclick = () => askName();

/* ======================= SCHNEE ======================= */
(function(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = document.getElementById("snow"), x = c.getContext("2d");
  let W,H; const flakes=[];
  const resize = () => { W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio; };
  resize(); addEventListener("resize", resize);
  for(let i=0;i<32;i++) flakes.push({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.5,s:Math.random()*.0005+.00025,w:Math.random()*6});
  (function tick(){
    x.clearRect(0,0,W,H); x.fillStyle="rgba(243,234,216,.35)";
    flakes.forEach(f=>{ f.y+=f.s; f.w+=.008; if(f.y>1){f.y=-.02;f.x=Math.random();}
      x.beginPath(); x.arc((f.x+Math.sin(f.w)*.008)*W, f.y*H, f.r*devicePixelRatio, 0, 7); x.fill(); });
    requestAnimationFrame(tick);
  })();
})();

/* ======================= START ======================= */
initStore().then(() => { render(); if(!NAME) askName(); });
}
</script>
