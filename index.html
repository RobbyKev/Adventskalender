<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1f1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Familien-Adventskalender</title>
<style>
  :root{
    --bg:#0f1f1a; --bg2:#16302a; --card:#1d3b33; --gold:#e8b85c; --gold2:#f3d28f;
    --red:#c2463d; --cream:#f6efe2; --muted:#a9bcb3; --line:rgba(246,239,226,.12);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 60% at 50% 0%,#1f4238 0%,var(--bg) 60%)}
  #snow{position:fixed;inset:0;pointer-events:none;z-index:0}
  main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 16px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 2px 18px}
  h1{font-family:Georgia,"Times New Roman",serif;font-weight:normal;font-size:30px;line-height:1.05;margin:0}
  h1 small{display:block;font-size:13px;letter-spacing:.02em;color:var(--gold);font-family:inherit;margin-bottom:4px}
  .who{background:none;border:1px solid var(--line);color:var(--muted);border-radius:999px;
    padding:7px 12px;font-size:13px;white-space:nowrap}
  .hint{font-size:14px;color:var(--muted);margin:0 2px 16px;line-height:1.4}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
  .door{position:relative;aspect-ratio:1/1.12;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--cream);font-family:Georgia,serif;font-size:26px;
    display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;
    transition:transform .15s ease}
  .door:active{transform:scale(.96)}
  .door.big{grid-column:span 2;aspect-ratio:auto}
  .door.locked{background:var(--bg2);color:rgba(246,239,226,.35);cursor:default}
  .door.today{background:var(--red);border-color:var(--gold);box-shadow:0 0 0 2px rgba(232,184,92,.35)}
  .door.done{background:#2a4a40}
  .door.done::after{content:"✓";position:absolute;top:6px;right:8px;font-size:13px;color:var(--gold);font-family:sans-serif}
  .door .tag{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:10px;
    font-family:sans-serif;letter-spacing:.04em;color:var(--gold2);opacity:.85}
  .door.locked .tag{display:none}
  section.board{margin-top:26px;background:rgba(29,59,51,.6);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px}
  section.board h2{font-size:15px;margin:0 0 10px;color:var(--gold);font-weight:600}
  .row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
  .row:first-of-type{border-top:0}
  .row span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
  .empty{color:var(--muted);font-size:14px}
  .pre{background:linear-gradient(160deg,#24483e,#1a3731);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:18px}
  .pre .lbl{font-size:13px;color:var(--gold);margin:0 0 8px}
  .cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;text-align:center}
  .cd div{background:rgba(15,31,26,.55);border-radius:12px;padding:10px 0}
  .cd b{display:block;font-family:Georgia,serif;font-weight:normal;font-size:clamp(26px,8vw,36px);color:var(--cream);font-variant-numeric:tabular-nums}
  .cd span{font-size:12px;color:var(--muted)}
  .spruch{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--line);font-size:16px;line-height:1.45}
  .spruch small{display:block;font-size:12px;color:var(--gold);margin-bottom:4px}
  .spruch .pointe{display:block;margin-top:6px;color:var(--gold2)}
  .surprise{display:block;width:100%;text-align:left;margin-top:16px;border:1px solid var(--gold);background:var(--red);
    color:var(--cream);border-radius:14px;padding:14px 16px;font-size:16px;line-height:1.35;cursor:pointer}
  .surprise b{display:block;font-family:Georgia,serif;font-weight:normal;font-size:20px;margin-bottom:2px}
  .surprise.old{background:#2c5246;border-color:var(--line)}
  .teaser{margin:16px 0 0;font-size:14px;color:var(--muted)}
  .vbar{display:flex;gap:8px;margin:0 0 14px}
  .vbar button{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:14px}
  .vbar button.on{background:var(--gold);color:#1d2b26;border-color:var(--gold)}
  .mode{margin-top:14px;text-align:center;font-size:12px;color:var(--muted)}
  /* Sheet */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--cream);color:#1d2b26;
    border-radius:20px 20px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    animation:up .25s ease}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .sheet .kicker{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--red);font-weight:700}
  .sheet h3{font-family:Georgia,serif;font-weight:normal;font-size:24px;margin:6px 0 12px;line-height:1.2}
  .sheet p{font-size:16px;line-height:1.5;margin:0 0 14px}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:600;
    margin-top:10px;cursor:pointer;text-align:center;text-decoration:none}
  .btn.wa{background:#1f8f4e;color:#fff}
  .btn.ok{background:#1d3b33;color:var(--cream)}
  .btn.ghost{background:transparent;color:#55655f}
  .opts{display:grid;gap:8px;margin:6px 0 10px}
  .opt{border:1.5px solid #d6cbb5;background:#fff;border-radius:12px;padding:13px 14px;font-size:16px;text-align:left;color:#1d2b26}
  .opt.right{border-color:#1f8f4e;background:#e3f3e8}
  .opt.wrong{border-color:var(--red);background:#f8e3e0}
  .opt:disabled{opacity:1}
  .result{font-size:15px;margin:6px 0 4px}
  .dabei{font-size:14px;color:#55655f;margin-top:14px;line-height:1.4}
  .namebox input{width:100%;font-size:18px;padding:13px;border-radius:12px;border:1.5px solid #d6cbb5;margin:4px 0 4px}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<main>
  <header>
    <h1><small>Familie · Advent 2026</small><span id="titel">24 Türchen</span></h1>
    <button class="who" id="whoBtn"></button>
  </header>
  <div class="vbar" id="vbar" hidden></div>
  <p class="hint" id="hint"></p>
  <section class="pre" id="pre" hidden></section>
  <div class="grid" id="grid"></div>

  <section class="board" id="boardBox">
    <h2>Quiz-Rangliste</h2>
    <div id="board"></div>
  </section>
  <div class="mode" id="mode"></div>
</main>

<div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div>

<script>
/* =========================================================
   EINSTELLUNGEN
   1) Firebase: Projekt anlegen → Realtime Database aktivieren →
      Web-App registrieren → Config hier einfügen.
      Ohne Config läuft alles lokal (nur auf dem eigenen Handy).
   2) Vorschau: index.html?vorschau=1 öffnet alle Türchen zum Testen.
   ========================================================= */
const FIREBASE_CONFIG = null;
/* Beispiel:
const FIREBASE_CONFIG = {
  apiKey: "...",
  authDomain: "dein-projekt.firebaseapp.com",
  databaseURL: "https://dein-projekt-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "dein-projekt",
  appId: "..."
};
*/
const DB_PATH = "advent2026";

/* ======================= INHALTE =======================
   typ: frage | quiz | foto | aufgabe
   quiz: optionen + richtig (Index ab 0) + info (Auflösung)
   ======================================================= */
const TAGE = [
  {typ:"frage", titel:"Ganz früher", text:"Was ist deine früheste Weihnachtserinnerung? Egal wie klein – schreib sie in die Gruppe."},
  {typ:"quiz", titel:"Woher kommt der Adventskranz?", text:"Der erste Adventskranz hing 1839 in einem Waisenhaus. In welchem Land?",
    optionen:["Schweden","Deutschland","Österreich","Dänemark"], richtig:1,
    info:"Johann Hinrich Wichern hat ihn in Hamburg erfunden – damals mit 24 Kerzen, damit die Kinder die Tage zählen konnten."},
  {typ:"foto", titel:"Deko-Liebling", text:"Schick ein Foto von deinem Lieblings-Deko-Teil. Bonus, wenn es eine Geschichte hat."},
  {typ:"foto", titel:"Familie an der Wand", text:"Welches Familienfoto hängt oder steht bei dir zu Hause? Fotografier es und schick es in die Gruppe."},
  {typ:"quiz", titel:"Schätzfrage", text:"Wie alt ist ein Weihnachtsbaum ungefähr, wenn er verkauft wird?",
    optionen:["ca. 2 Jahre","ca. 5 Jahre","ca. 10 Jahre","ca. 20 Jahre"], richtig:2, info:"Rund 8 bis 12 Jahre steht so ein Baum auf dem Feld, bis er bei uns im Wohnzimmer landet."},
  {typ:"foto", titel:"Nikolaus-Schuh", text:"Heute ist Nikolaus! Zeig den Schuh, den du rausgestellt hast – oder rausgestellt hättest."},
  {typ:"frage", titel:"Familien-Schätzfrage", text:"Wie alt sind alle in dieser Gruppe zusammen? Nicht rechnen, nur schätzen – und dann eure Zahl in die Gruppe! Wer am nächsten dran ist, gewinnt."},
  {typ:"foto", titel:"Sockencheck", text:"Zeig deine Socken. Jetzt. Keine Ausreden."},
  {typ:"quiz", titel:"Allein zu Haus", text:"In welchem Jahr kam „Kevin – Allein zu Haus“ ins Kino?",
    optionen:["1987","1990","1993","1996"], richtig:1, info:"1990 – und läuft seitdem jedes Jahr wieder."},
  {typ:"quiz", titel:"Emoji-Lied", text:"Welches Weihnachtslied ist das? 🔔🔔🔔 🦌🛷💨",
    optionen:["Stille Nacht","O Tannenbaum","Jingle Bells","Last Christmas"], richtig:2, info:"Jingle Bells – ursprünglich übrigens ein Lied über ein Schlittenrennen, nicht über Weihnachten."},
  {typ:"foto", titel:"Sperrbildschirm", text:"Mach einen Screenshot von deinem Sperrbildschirm und schick ihn in die Gruppe."},
  {typ:"quiz", titel:"Schätzfrage", text:"Wie viele Tage dauert die Adventszeit in diesem Jahr – vom 1. Advent bis Heiligabend?",
    optionen:["22 Tage","24 Tage","26 Tage","28 Tage"], richtig:2, info:"26 Tage: Der 1. Advent war am 29. November. Der Kalender hat trotzdem nur 24 Türchen."},
  {typ:"foto", titel:"Lichtertag", text:"Heute ist Luciafest, das Fest der Lichter. Schick ein Foto von einer Kerze oder Lichterkette bei dir."},
  {typ:"foto", titel:"Zeitreise", text:"Such ein altes Weihnachtsfoto raus (gern peinlich) und schick es in die Gruppe. Die anderen raten, wann es war."},
  {typ:"foto", titel:"Mützen-Selfie", text:"Selfie mit Weihnachtsmütze! Keine da? Dann eben irgendwas anderes auf dem Kopf."},
  {typ:"quiz", titel:"Schätzfrage", text:"Wie viele Weihnachtsbäume werden in Deutschland pro Jahr ungefähr verkauft?",
    optionen:["ca. 5 Millionen","ca. 10 Millionen","ca. 25 Millionen","ca. 50 Millionen"], richtig:2, info:"Rund 23 bis 25 Millionen – die meisten davon Nordmanntannen."},
  {typ:"quiz", titel:"Schätzfrage", text:"Wie viele Kalorien hat ungefähr eine Tasse Glühwein (0,2 l)?",
    optionen:["ca. 50 kcal","ca. 100 kcal","ca. 200 kcal","ca. 400 kcal"], richtig:2, info:"Rund 200 kcal – vor allem durch Zucker und Alkohol."},
  {typ:"foto", titel:"Familienschatz", text:"Zeig etwas bei dir, das aus der Familie stammt – von Oma, Opa, Eltern oder Geschwistern. Ein Satz dazu, woher es kommt, reicht."},
  {typ:"quiz", titel:"Wortherkunft", text:"Was bedeutet das lateinische Wort „Advent“?",
    optionen:["Warten","Ankunft","Licht","Feier"], richtig:1, info:"Adventus = Ankunft."},
  {typ:"foto", titel:"Fensterblick", text:"Mach ein Foto aus deinem Fenster – so wie es gerade ist."},
  {typ:"quiz", titel:"Sonnenwende", text:"Was ist rund um den 21. Dezember besonders?",
    optionen:["Längste Nacht des Jahres","Erster Schnee ist statistisch fällig","Vollmond","Tag mit den meisten Paketen"], richtig:0, info:"Wintersonnenwende – ab jetzt werden die Tage wieder länger."},
  {typ:"frage", titel:"Tradition", text:"Welche Familientradition sollen wir unbedingt behalten – oder welche sollten wir neu einführen?"},
  {typ:"aufgabe", titel:"Summ mal", text:"Schick eine Sprachnachricht: 10 Sekunden ein Weihnachtslied summen (nicht singen!). Die anderen raten."},
  {typ:"foto", titel:"Heiligabend", text:"Schick ein Foto von eurem Baum oder Tisch – und einen Wunsch für nächstes Jahr. Frohe Weihnachten! 🎄"},
];

/* Aufwärmrunde: vor dem 1.12. schon offen */
const BONUS = [
  {typ:"foto", titel:"Erste Deko", text:"Zeig deine erste Weihnachtsdeko – oder das Chaos davor. Beides zählt."},
  {typ:"frage", titel:"Wunsch", text:"Was wünschst du dir dieses Jahr – nicht zum Auspacken, sondern zum Erleben?"},
  {typ:"foto", titel:"Kuschelecke", text:"Wo sitzt du an Winterabenden am liebsten? Foto von deinem Lieblingsplatz zu Hause."},
];
/* Witz oder Spruch für jeden Tag bis zum 1.12. (Tag im November → Text) */
const SPRUECHE = {
  24:["Warum sind Weihnachtsbäume so schlecht im Stricken?","Sie lassen ständig die Nadeln fallen."],
  25:["Was sagt ein Schneemann zum anderen?","„Riechst du auch Möhren?“"],
  26:["Wie heißt die Frau vom Weihnachtsmann?","Mary Christmas."],
  27:["Wie nennt man einen Weihnachtsmann, der Angst vor engen Kaminen hat?","Klaustrophobi-Klaus."],
  28:["Vorfreude ist die schönste Freude.",""],
  29:["Heute ist der 1. Advent – erste Kerze an!","Erst eine Kerze, dann zwei, dann drei, dann vier …"],
  30:["Welche Türchen bleiben heute noch zu?","Alle 24. Aber nur noch bis Mitternacht."],
};
const SPRUCH_RESERVE = [
  ["Was essen Schneemänner am liebsten?","Eisbein."],
  ["Warum ist der Schneemann so entspannt?","Er weiß: Irgendwann löst sich alles von selbst."],
  ["Warum gehen Engel nie ins Fitnessstudio?","Sie sind schon himmlisch in Form."],
];
const getItem = id => String(id).startsWith("b") ? BONUS[+String(id).slice(1)-1] : TAGE[id-1];
const labelOf = id => String(id).startsWith("b") ? "Überraschung" : `Türchen ${id}`;
const START_MS = Date.UTC(2026,10,30,23,0,0); // 1.12.2026 00:00 in Berlin
const TYP_LABEL = {frage:"Frage", quiz:"Quiz", foto:"Foto", aufgabe:"Aufgabe"};
// feste, gemischte Anordnung der Türchen
const REIHENFOLGE = [7,15,2,21,11,24,4,18,13,1,20,9,16,6,23,10,3,19,12,22,8,14,5,17];

/* ======================= DATUM ======================= */
const VORSCHAU = new URLSearchParams(location.search).has("vorschau");
function berlinHeute(){
  const p = new Intl.DateTimeFormat("de-DE",{timeZone:"Europe/Berlin",year:"numeric",month:"numeric",day:"numeric"})
    .formatToParts(new Date());
  const g = t => +p.find(x=>x.type===t).value;
  return {y:g("year"), m:g("month"), d:g("day")};
}
function offenBis(){ // höchstes Türchen, das offen ist
  if (VORSCHAU) return 24;
  const t = berlinHeute();
  if (t.y > 2026 || (t.y===2026 && t.m===12 && t.d>24)) return 24;
  if (t.y===2026 && t.m===12) return t.d;
  return 0;
}
function heuteNr(){ const t=berlinHeute(); return (t.y===2026&&t.m===12&&t.d<=24)?t.d:0; }

/* ======================= SPEICHER ======================= */
let STATE = {}; // {tage:{ "5": {dabei:{name:true}, quiz:{name:idx}} }}
let fb = null;
const LS_KEY = "advent2026-local";

async function initStore(){
  if (FIREBASE_CONFIG){
    try{
      const v = "10.12.2";
      const {initializeApp} = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
      const db = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-database.js`);
      const app = initializeApp(FIREBASE_CONFIG);
      const d = db.getDatabase(app);
      fb = {db, d};
      db.onValue(db.ref(d, DB_PATH), snap => { STATE = snap.val() || {}; render(); });
      document.getElementById("mode").textContent = "Live verbunden – alle sehen dasselbe.";
      return;
    }catch(e){ console.error(e); }
  }
  try{ STATE = JSON.parse(localStorage.getItem(LS_KEY)) || {}; }catch(e){ STATE = {}; }
  document.getElementById("mode").textContent = FIREBASE_CONFIG
    ? "Keine Verbindung – Daten nur auf diesem Handy."
    : "Lokal-Modus (Firebase noch nicht eingerichtet).";
}
function save(path, value){
  if (fb){ fb.db.set(fb.db.ref(fb.d, `${DB_PATH}/${path}`), value); return; }
  const parts = path.split("/"); let o = STATE;
  parts.slice(0,-1).forEach(k => o = (o[k] = o[k] || {}));
  o[parts.at(-1)] = value;
  try{ localStorage.setItem(LS_KEY, JSON.stringify(STATE)); }catch(e){}
  render();
}
const safeKey = n => n.replace(/[.#$\[\]\/]/g,"_");
const tagData = nr => (STATE.tage && STATE.tage[nr]) || {};

/* ======================= NAME ======================= */
let NAME = "";
try{ NAME = localStorage.getItem("advent2026-name") || ""; }catch(e){}
function askName(then){
  const s = document.getElementById("sheet");
  s.innerHTML = `
    <div class="kicker">Hallo!</div>
    <h3>Wie heißt du?</h3>
    <p>Damit die anderen sehen, wer schon dabei war. Kein Konto, nur dein Name.</p>
    <div class="namebox"><input id="nameIn" maxlength="20" placeholder="z. B. Silke" value="${esc(NAME)}" autocomplete="given-name"></div>
    <button class="btn ok" id="nameOk">Los geht's</button>`;
  openSheet(false);
  const inp = document.getElementById("nameIn");
  const go = () => {
    const v = inp.value.trim(); if(!v) return inp.focus();
    NAME = v; try{ localStorage.setItem("advent2026-name", v); }catch(e){}
    closeSheet(); render(); then && then();
  };
  document.getElementById("nameOk").onclick = go;
  inp.onkeydown = e => { if(e.key==="Enter") go(); };
  setTimeout(()=>inp.focus(), 250);
}

/* ======================= RENDER ======================= */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let PREVIEW_PHASE = "pre";
const isPre = () => VORSCHAU ? PREVIEW_PHASE==="pre" : Date.now() < START_MS;

function render(){
  const pre = isPre();
  document.getElementById("whoBtn").textContent = NAME ? `👤 ${NAME}` : "Name wählen";
  document.getElementById("titel").textContent = pre ? "Bald geht's los" : "24 Türchen";
  const vbar = document.getElementById("vbar");
  if (VORSCHAU){
    vbar.hidden = false;
    vbar.innerHTML = `<button data-p="pre" class="${pre?"on":""}">Vorschau: Countdown</button><button data-p="kal" class="${pre?"":"on"}">Vorschau: Kalender</button>`;
    vbar.querySelectorAll("button").forEach(b => b.onclick = () => { PREVIEW_PHASE = b.dataset.p; render(); });
  }
  document.getElementById("hint").hidden = pre;
  document.getElementById("grid").hidden = pre;
  document.getElementById("boardBox").hidden = pre;
  renderPre();
  if (pre) return;

  const offen = offenBis(), heute = heuteNr();
  const hint = document.getElementById("hint");
  if (heute) hint.textContent = `Heute ist Türchen ${heute} dran. Verpasste Türchen kannst du jederzeit nachholen.`;
  else hint.textContent = VORSCHAU ? "Vorschau-Modus: alle Türchen offen." : "Alle Türchen sind offen. Frohe Weihnachten!";

  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  REIHENFOLGE.forEach(nr => {
    const t = TAGE[nr-1], b = document.createElement("button");
    const locked = nr > offen;
    const done = NAME && tagData(nr).dabei && tagData(nr).dabei[safeKey(NAME)];
    b.className = "door" + (nr===24?" big":"") + (locked?" locked":"") + (nr===heute?" today":"") + (done&&!locked?" done":"");
    b.innerHTML = `${nr}<span class="tag">${TYP_LABEL[t.typ]}</span>`;
    b.setAttribute("aria-label", `Türchen ${nr}${locked?" (noch zu)":""}`);
    if (!locked) b.onclick = () => NAME ? openDoor(nr) : askName(()=>openDoor(nr));
    grid.appendChild(b);
  });
  renderBoard();
}

/* Überraschungen: jede Person bekommt an 3 zufälligen Tagen (24.–30.11.) eine Bonus-Aufgabe */
function hashStr(str){ let h=2166136261; for (const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function surpriseDays(name){
  const days=[24,25,26,27,28,29,30]; let seed=hashStr(name.trim().toLowerCase())||1;
  for (let i=days.length-1;i>0;i--){ seed=(Math.imul(seed^(seed>>>15),2246822507)>>>0)||7; const j=seed%(i+1); [days[i],days[j]]=[days[j],days[i]]; }
  return days.slice(0,BONUS.length).sort((a,b)=>a-b);
}

function renderPre(){
  const box = document.getElementById("pre");
  if (!isPre()){ box.hidden = true; box.innerHTML = ""; return; }
  box.hidden = false;
  const t = berlinHeute();
  const heute = t.m===11 ? t.d : 31;
  const sp = (t.m===11 && SPRUECHE[t.d]) || SPRUCH_RESERVE[t.d % SPRUCH_RESERVE.length];
  let extra = "";
  if (NAME){
    const tage = surpriseDays(NAME), me = safeKey(NAME);
    const items = BONUS.map((b,i)=>({b, id:"b"+(i+1), tag: VORSCHAU ? heute : tage[i]}))
      .filter(x => x.tag <= heute)
      .map(x => ({...x, done: !!(tagData(x.id).dabei && tagData(x.id).dabei[me])}));
    const offen = items.filter(x=>!x.done);
    extra = offen.map(x => x.tag===heute
      ? `<button class="surprise" data-id="${x.id}"><b>🎁 Überraschung!</b>Heute wartet eine kleine Bonus-Aufgabe auf dich. Tippen zum Öffnen.</button>`
      : `<button class="surprise old" data-id="${x.id}"><b>Noch offen</b>Deine Bonus-Aufgabe vom ${x.tag}. November.</button>`).join("");
    const erledigt = items.length - offen.length;
    if (erledigt) extra += `<p class="teaser">✓ ${erledigt} Bonus-${erledigt===1?"Aufgabe":"Aufgaben"} erledigt.</p>`;
    if (items.length < BONUS.length) extra += `<p class="teaser">Schau jeden Tag mal rein – vielleicht wartet eine Überraschung auf dich.</p>`;
  }
  box.innerHTML = `
    <p class="lbl">Noch bis zum ersten Türchen</p>
    <div class="cd" id="cd"></div>
    <p class="spruch"><small>Witz des Tages</small>${esc(sp[0])}${sp[1]?`<span class="pointe">${esc(sp[1])}</span>`:""}</p>
    ${extra}`;
  box.querySelectorAll(".surprise").forEach(b => b.onclick = () => openDoor(b.dataset.id));
  tickCountdown();
}
function tickCountdown(){
  const el = document.getElementById("cd"); if(!el) return;
  let ms = START_MS - Date.now();
  if (ms <= 0){ render(); return; }
  const tg=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60, s=Math.floor(ms/1e3)%60;
  const pad = n => String(n).padStart(2,"0");
  el.innerHTML = [[tg,tg===1?"Tag":"Tage"],[pad(h),"Std"],[pad(m),"Min"],[pad(s),"Sek"]]
    .map(([v,l])=>`<div><b>${v}</b><span>${l}</span></div>`).join("");
}
setInterval(tickCountdown, 1000);

function renderBoard(){
  const punkte = {}, tage = STATE.tage || {};
  Object.entries(tage).forEach(([nr, d]) => {
    const t = getItem(nr); if(!t || t.typ!=="quiz" || !d.quiz) return;
    Object.entries(d.quiz).forEach(([n, idx]) => {
      punkte[n] = (punkte[n]||0) + (idx===t.richtig?1:0);
    });
  });
  const dabei = {};
  Object.values(tage).forEach(d => Object.keys(d.dabei||{}).forEach(n => dabei[n]=(dabei[n]||0)+1));
  const namen = [...new Set([...Object.keys(punkte), ...Object.keys(dabei)])]
    .sort((a,b)=>(punkte[b]||0)-(punkte[a]||0) || (dabei[b]||0)-(dabei[a]||0));
  const el = document.getElementById("board");
  el.innerHTML = namen.length
    ? namen.map((n,i)=>`<div class="row"><span>${i<3?["🥇","🥈","🥉"][i]+" ":""}${esc(n)}</span><span>${punkte[n]||0} Pkt · ${dabei[n]||0}× dabei</span></div>`).join("")
    : `<div class="empty">Noch niemand dabei.</div>`;
}

/* ======================= TÜRCHEN ======================= */
function openDoor(nr){
  const t = getItem(nr), d = tagData(nr), me = safeKey(NAME);
  const dabeiNamen = Object.keys(d.dabei||{});
  const istDabei = !!(d.dabei && d.dabei[me]);
  const s = document.getElementById("sheet");
  let body = `<div class="kicker">${labelOf(nr)} · ${TYP_LABEL[t.typ]}</div>
    <h3>${esc(t.titel)}</h3><p>${esc(t.text)}</p>`;

  if (t.typ==="quiz"){
    const meine = d.quiz ? d.quiz[me] : undefined;
    const beantwortet = meine !== undefined;
    body += `<div class="opts">` + t.optionen.map((o,i)=>{
      let cls = "opt";
      if (beantwortet && i===t.richtig) cls += " right";
      else if (beantwortet && i===meine) cls += " wrong";
      return `<button class="${cls}" data-i="${i}" ${beantwortet?"disabled":""}>${esc(o)}</button>`;
    }).join("") + `</div>`;
    if (beantwortet){
      const alle = Object.values(d.quiz||{}), richtige = alle.filter(x=>x===t.richtig).length;
      body += `<p class="result"><b>${meine===t.richtig?"Richtig! +1 Punkt":"Leider daneben."}</b> ${esc(t.info)}</p>
        <p class="result" style="color:#55655f">${richtige} von ${alle.length} lagen richtig.</p>
        <a class="btn wa" id="waBtn" href="#">In der Gruppe angeben 💬</a>`;
    }
  } else {
    body += `<a class="btn wa" id="waBtn" href="#">In WhatsApp antworten 💬</a>
      <button class="btn ok" id="doneBtn">${istDabei?"✓ Erledigt":"Hab ich gemacht ✓"}</button>`;
  }
  body += `<div class="dabei">${dabeiNamen.length ? "Dabei: "+dabeiNamen.map(esc).join(", ") : "Noch niemand dabei – sei die/der Erste."}</div>
    <button class="btn ghost" id="closeBtn">Schließen</button>`;
  s.innerHTML = body;
  openSheet(true);

  s.querySelectorAll(".opt:not([disabled])").forEach(b => b.onclick = () => {
    save(`tage/${nr}/quiz/${me}`, +b.dataset.i);
    save(`tage/${nr}/dabei/${me}`, true);
    setTimeout(()=>openDoor(nr), fb?400:0);
  });
  const done = document.getElementById("doneBtn");
  if (done) done.onclick = () => { save(`tage/${nr}/dabei/${me}`, !istDabei || null); setTimeout(()=>openDoor(nr), fb?400:0); };
  const wa = document.getElementById("waBtn");
  if (wa){
    let msg;
    if (t.typ==="quiz"){
      const meine = (tagData(nr).quiz||{})[me];
      msg = `🎄 ${labelOf(nr)}: ${t.titel}\n${meine===t.richtig?"Hab's richtig! 😎":"Lag daneben 🙈"} Wer noch?`;
    } else msg = `🎄 ${labelOf(nr)} – ${t.titel}\n${t.text}\n\n➜ `;
    wa.href = "https://wa.me/?text=" + encodeURIComponent(msg);
    wa.target = "_blank"; wa.rel = "noopener";
  }
  document.getElementById("closeBtn").onclick = closeSheet;
}

const overlay = document.getElementById("overlay");
function openSheet(closable){ overlay.classList.add("show"); overlay.dataset.closable = closable?"1":""; }
function closeSheet(){ overlay.classList.remove("show"); }
overlay.addEventListener("click", e => { if (e.target===overlay && overlay.dataset.closable) closeSheet(); });
document.getElementById("whoBtn").onclick = () => askName();

/* ======================= SCHNEE ======================= */
(function(){
  const c = document.getElementById("snow"), x = c.getContext("2d");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let W,H,flakes=[];
  const resize = () => { W=c.width=innerWidth*devicePixelRatio; H=c.height=innerHeight*devicePixelRatio; };
  resize(); addEventListener("resize", resize);
  for(let i=0;i<45;i++) flakes.push({x:Math.random(),y:Math.random(),r:Math.random()*1.6+.6,s:Math.random()*.0006+.0003,w:Math.random()*6});
  (function tick(){
    x.clearRect(0,0,W,H); x.fillStyle="rgba(246,239,226,.55)";
    flakes.forEach(f=>{ f.y+=f.s; f.w+=.01; if(f.y>1){f.y=-.02;f.x=Math.random();}
      x.beginPath(); x.arc((f.x+Math.sin(f.w)*.01)*W, f.y*H, f.r*devicePixelRatio, 0, 7); x.fill(); });
    requestAnimationFrame(tick);
  })();
})();

/* ======================= START ======================= */
initStore().then(() => { render(); if(!NAME) askName(); });
</script>
